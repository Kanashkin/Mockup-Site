<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Generator</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f0f0f;--surface:#1a1a1a;--border:#2a2a2a;--accent:#e8ff47;--text:#f0f0f0;--muted:#555}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px;gap:20px}
    h1{font-size:28px;font-weight:700;letter-spacing:-1px}
    h1 span{color:var(--accent)}
    .sub{color:var(--muted);font-size:13px;margin-top:4px;text-align:center}
    .main{display:flex;gap:24px;width:100%;max-width:1060px;align-items:flex-start}
    .preview-wrap{flex:0 0 auto;position:relative;width:460px}
    #previewCanvas{width:460px;height:690px;border-radius:12px;display:block;cursor:crosshair;background:#222}
    #previewCanvas.has-design{cursor:move}
    #uploadOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:rgba(0,0,0,0.45);cursor:pointer}
    #uploadOverlay input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    #uploadOverlay .icon{font-size:38px}
    #uploadOverlay .txt{font-size:14px;color:#fff;font-weight:600}
    #uploadOverlay .sub2{font-size:12px;color:rgba(255,255,255,0.4)}
    #uploadOverlay.hidden{display:none}
    .sidebar{flex:1;display:flex;flex-direction:column;gap:14px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .card-title{padding:10px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
    .card-body{padding:16px}

    /* Color picker */
    .color-section{}
    .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .preset{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
    .preset:hover{transform:scale(1.15)}
    .preset.active{border-color:var(--accent);transform:scale(1.1)}
    .color-row{display:flex;align-items:center;gap:10px}
    .color-row label{font-size:12px;color:var(--muted)}
    #colorPicker{width:44px;height:32px;border:none;border-radius:6px;cursor:pointer;padding:0;background:none}
    #colorHex{font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;width:80px;font-family:monospace}

    /* Sliders */
    .sliders{display:flex;flex-direction:column;gap:12px}
    .row{display:flex;align-items:center;gap:10px;font-size:13px}
    .row label{width:48px;color:var(--muted);font-size:12px}
    .row input[type=range]{flex:1;accent-color:var(--accent)}
    .row span{width:36px;text-align:right;font-size:12px}
    .hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
    .btn{width:100%;padding:13px;background:var(--accent);color:#111;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
    .btn:disabled{opacity:.3;cursor:not-allowed}
    .btn:hover:not(:disabled){opacity:.85}
    .btn2{width:100%;padding:10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;margin-top:8px;transition:border-color .2s,color .2s}
    .btn2:hover{border-color:var(--accent);color:var(--accent)}
    .dl{display:none;width:100%;margin-top:10px;padding:11px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:8px;font-size:13px;font-weight:600;text-align:center;text-decoration:none}
    .dl.show{display:block}
    #resultImg{width:100%;border-radius:8px;display:none;margin-top:8px}
    #resultImg.show{display:block}
    .status{margin-top:8px;font-size:12px;color:var(--muted);text-align:center;min-height:16px}
    .status.err{color:#f66}.status.ok{color:var(--accent)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(232,255,71,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
  </style>
</head>
<body>

<h1>T-Shirt <span>Mockup</span></h1>
<p class="sub">Upload your design — position it and pick a color</p>

<div class="main">
  <div class="preview-wrap">
    <canvas id="previewCanvas" width="460" height="690"></canvas>
    <div id="uploadOverlay">
      <input type="file" id="fileInput" accept="image/*">
      <div class="icon">🎨</div>
      <div class="txt">Click to upload design</div>
      <div class="sub2">PNG with transparency works best</div>
    </div>
  </div>

  <div class="sidebar">

    <!-- Shirt Color -->
    <div class="card">
      <div class="card-title">Shirt Color</div>
      <div class="card-body">
        <div class="presets" id="presets"></div>
        <div class="color-row">
          <label>Custom</label>
          <input type="color" id="colorPicker" value="#ffffff">
          <input type="text" id="colorHex" value="#ffffff" maxlength="7">
        </div>
      </div>
    </div>

    <!-- Position -->
    <div class="card">
      <div class="card-title">Position & Size</div>
      <div class="card-body">
        <div class="sliders">
          <div class="row"><label>Size</label><input type="range" id="sSize" min="5" max="80" value="35"><span id="vSize">35%</span></div>
          <div class="row"><label>X</label><input type="range" id="sX" min="0" max="100" value="50"><span id="vX">50%</span></div>
          <div class="row"><label>Y</label><input type="range" id="sY" min="0" max="100" value="48"><span id="vY">48%</span></div>
        </div>
        <p class="hint">💡 Drag design on shirt · Scroll to resize</p>
        <button class="btn2" id="resetBtn">↺ Reset</button>
      </div>
    </div>

    <!-- Export -->
    <div class="card">
      <div class="card-title">Export</div>
      <div class="card-body">
        <button class="btn" id="renderBtn" disabled>Generate High-Res →</button>
        <div class="status" id="status"></div>
        <img id="resultImg" alt="result">
        <a class="dl" id="dlBtn" download="mockup.png">↓ Download PNG</a>
      </div>
    </div>
  </div>
</div>

<script>
const CW=460,CH=690;
const SRC_W=2342,SRC_H=2616;

// Shirt color presets
const PRESETS = [
  {name:'White',   hex:'#ffffff'},
  {name:'Black',   hex:'#1a1a1a'},
  {name:'Navy',    hex:'#1d3557'},
  {name:'Red',     hex:'#e63946'},
  {name:'Forest',  hex:'#2d6a4f'},
  {name:'Sage',    hex:'#84a98c'},
  {name:'Sand',    hex:'#d4a574'},
  {name:'Slate',   hex:'#64748b'},
  {name:'Maroon',  hex:'#7b2d8b'},
  {name:'Orange',  hex:'#e76f51'},
  {name:'Sky',     hex:'#48cae4'},
  {name:'Pink',    hex:'#f4a261'},
];

// Build presets UI
const presetsEl = document.getElementById('presets');
PRESETS.forEach(p => {
  const el = document.createElement('div');
  el.className = 'preset' + (p.hex==='#ffffff'?' active':'');
  el.style.background = p.hex;
  el.style.border = p.hex==='#ffffff'||p.hex==='#f5f5f5' ? '2px solid #444' : '2px solid transparent';
  el.title = p.name;
  el.addEventListener('click',()=>setColor(p.hex,el));
  presetsEl.appendChild(el);
});

let shirtColor = '#ffffff';
let activePreset = presetsEl.firstChild;

function setColor(hex, presetEl) {
  shirtColor = hex;
  document.getElementById('colorPicker').value = hex;
  document.getElementById('colorHex').value = hex;
  // Update active preset
  presetsEl.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
  if (presetEl) presetEl.classList.add('active');
  drawPreview();
}

document.getElementById('colorPicker').addEventListener('input', e=>{
  shirtColor=e.target.value;
  document.getElementById('colorHex').value=e.target.value;
  presetsEl.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
  drawPreview();
});
document.getElementById('colorHex').addEventListener('change', e=>{
  let v=e.target.value;
  if(!v.startsWith('#'))v='#'+v;
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    shirtColor=v;
    document.getElementById('colorPicker').value=v;
    drawPreview();
  }
});

// Canvas & state
const canvas=document.getElementById('previewCanvas');
const ctx=canvas.getContext('2d');
let shirtImg=null,designImg=null,file=null;
let warpMap=null,warpedPixels=null;
let pos={cx:0.5,cy:0.48,size:0.35};

// Load shirt
const si=new Image();
si.onload=()=>{shirtImg=si;drawPreview();};
si.src='/shirt_preview.png';

// Load warp map
fetch('/warp_data.json').then(r=>r.json()).then(d=>{
  warpMap=d;buildWarpLookup();drawPreview();
});

function buildWarpLookup(){
  const mw=warpMap.map_w,mh=warpMap.map_h;
  const mx=warpMap.map_x,my=warpMap.map_y;
  warpedPixels=new Float32Array(CW*CH*2);
  for(let py=0;py<CH;py++){
    for(let px=0;px<CW;px++){
      const mxf=px/CW*mw,myf=py/CH*mh;
      const mx0=Math.floor(mxf),my0=Math.floor(myf);
      const mx1=Math.min(mx0+1,mw-1),my1=Math.min(my0+1,mh-1);
      const fx=mxf-mx0,fy=myf-my0;
      const i00=my0*mw+mx0,i10=my0*mw+mx1,i01=my1*mw+mx0,i11=my1*mw+mx1;
      const xu=mx[i00];
      if(xu<0){warpedPixels[(py*CW+px)*2]=-1;continue;}
      const x00=mx[i00],x10=mx[i10]>=0?mx[i10]:x00;
      const x01=mx[i01]>=0?mx[i01]:x00,x11=mx[i11]>=0?mx[i11]:x00;
      const y00=my[i00],y10=my[i10]>=0?my[i10]:y00;
      const y01=my[i01]>=0?my[i01]:y00,y11=my[i11]>=0?my[i11]:y00;
      const u=x00*(1-fx)*(1-fy)+x10*fx*(1-fy)+x01*(1-fx)*fy+x11*fx*fy;
      const v=y00*(1-fx)*(1-fy)+y10*fx*(1-fy)+y01*(1-fx)*fy+y11*fx*fy;
      warpedPixels[(py*CW+px)*2]=u;
      warpedPixels[(py*CW+px)*2+1]=v;
    }
  }
}

// Parse hex color to rgb 0-1
function hexToRgb(hex){
  return[parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255];
}

// Draw preview
function drawPreview(){
  ctx.clearRect(0,0,CW,CH);
  if(!shirtImg){return;}

  // Draw shirt with color tint
  if(shirtColor==='#ffffff'){
    ctx.drawImage(shirtImg,0,0,CW,CH);
  } else {
    // Draw shirt then recolor via canvas compositing
    ctx.drawImage(shirtImg,0,0,CW,CH);
    const [tr,tg,tb]=hexToRgb(shirtColor);
    // Get pixel data and recolor
    const imgData=ctx.getImageData(0,0,CW,CH);
    const d=imgData.data;
    for(let i=0;i<d.length;i+=4){
      const lum=0.299*d[i]/255+0.587*d[i+1]/255+0.114*d[i+2]/255;
      // Simple desaturate check - if pixel is greyish (shirt) recolor it
      const mx=Math.max(d[i],d[i+1],d[i+2]);
      const mn=Math.min(d[i],d[i+1],d[i+2]);
      const sat=mx>10?(mx-mn)/mx:0;
      if(sat<0.25&&mx>20){
        d[i]=Math.round(lum*tr*255);
        d[i+1]=Math.round(lum*tg*255);
        d[i+2]=Math.round(lum*tb*255);
      }
    }
    ctx.putImageData(imgData,0,0);
  }

  if(!designImg||!warpedPixels)return;

  // Apply warped design
  const offC=document.createElement('canvas');
  offC.width=designImg.naturalWidth;offC.height=designImg.naturalHeight;
  const offG=offC.getContext('2d');
  offG.drawImage(designImg,0,0);
  const dw=offC.width,dh=offC.height;
  const dd=offG.getImageData(0,0,dw,dh).data;

  const sd=ctx.getImageData(0,0,CW,CH);
  const out=sd.data;
  const half=pos.size/2;

  for(let py=0;py<CH;py++){
    for(let px=0;px<CW;px++){
      const wi=(py*CW+px)*2;
      const su=warpedPixels[wi],sv=warpedPixels[wi+1];
      if(su<0)continue;
      const du=(su-(pos.cx-half))/pos.size;
      const dv=(sv-(pos.cy-half))/pos.size;
      if(du<0||du>=1||dv<0||dv>=1)continue;
      const dx=Math.floor(du*dw),dy=Math.floor(dv*dh);
      const di=(dy*dw+dx)*4;
      const da=dd[di+3]/255;
      if(da<0.01)continue;
      const oi=(py*CW+px)*4;
      const dr=dd[di]/255,dg=dd[di+1]/255,db=dd[di+2]/255;
      const sr=out[oi]/255,sg=out[oi+1]/255,sb=out[oi+2]/255;
      out[oi]=Math.round((sr*(1-da)+sr*dr*da)*255);
      out[oi+1]=Math.round((sg*(1-da)+sg*dg*da)*255);
      out[oi+2]=Math.round((sb*(1-da)+sb*db*da)*255);
    }
  }
  ctx.putImageData(sd,0,0);
}

// Upload
document.getElementById('fileInput').addEventListener('change',e=>{
  if(e.target.files[0])loadDesign(e.target.files[0]);
});
function loadDesign(f){
  file=f;
  const img=new Image();
  img.onload=()=>{
    designImg=img;
    document.getElementById('uploadOverlay').classList.add('hidden');
    canvas.classList.add('has-design');
    document.getElementById('renderBtn').disabled=false;
    drawPreview();
  };
  img.src=URL.createObjectURL(f);
}

// Sliders
const sSize=document.getElementById('sSize'),vSize=document.getElementById('vSize');
const sX=document.getElementById('sX'),vX=document.getElementById('vX');
const sY=document.getElementById('sY'),vY=document.getElementById('vY');
function syncSliders(){
  sSize.value=Math.round(pos.size*100);vSize.textContent=sSize.value+'%';
  sX.value=Math.round(pos.cx*100);vX.textContent=sX.value+'%';
  sY.value=Math.round(pos.cy*100);vY.textContent=sY.value+'%';
}
sSize.addEventListener('input',()=>{pos.size=sSize.value/100;vSize.textContent=sSize.value+'%';drawPreview();});
sX.addEventListener('input',()=>{pos.cx=sX.value/100;vX.textContent=sX.value+'%';drawPreview();});
sY.addEventListener('input',()=>{pos.cy=sY.value/100;vY.textContent=sY.value+'%';drawPreview();});
document.getElementById('resetBtn').addEventListener('click',()=>{pos={cx:0.5,cy:0.48,size:0.35};syncSliders();drawPreview();});

// Drag
let dragging=false,dsx,dsy,dcx,dcy;
canvas.addEventListener('mousedown',e=>{
  if(!designImg)return;
  dragging=true;dsx=e.offsetX;dsy=e.offsetY;dcx=pos.cx;dcy=pos.cy;
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const rect=canvas.getBoundingClientRect();
  pos.cx=Math.max(0,Math.min(1,dcx+(e.clientX-rect.left-dsx)/CW));
  pos.cy=Math.max(0,Math.min(1,dcy+(e.clientY-rect.top-dsy)/CH));
  syncSliders();drawPreview();
});
document.addEventListener('mouseup',()=>dragging=false);

// Scroll = resize
canvas.addEventListener('wheel',e=>{
  if(!designImg)return;
  pos.size=Math.max(0.05,Math.min(0.9,pos.size-e.deltaY*0.001));
  syncSliders();drawPreview();
  e.preventDefault();
},{passive:false});

// Generate
document.getElementById('renderBtn').addEventListener('click',async()=>{
  if(!file)return;
  const half=pos.size/2;
  const sx=Math.round((pos.cx-half)*SRC_W);
  const sy=Math.round((pos.cy-half)*SRC_H);
  const sw=Math.round(pos.size*SRC_W);
  const sh=Math.round(pos.size*SRC_H);

  document.getElementById('renderBtn').disabled=true;
  const st=document.getElementById('status');
  st.className='status';st.innerHTML='<span class="spin"></span>Rendering…';
  document.getElementById('resultImg').classList.remove('show');
  document.getElementById('dlBtn').classList.remove('show');

  const form=new FormData();
  form.append('file',file);
  form.append('x',sx);form.append('y',sy);
  form.append('w',sw);form.append('h',sh);
  form.append('color',shirtColor);

  try{
    const res=await fetch('/render',{method:'POST',body:form});
    if(!res.ok)throw new Error('Error '+res.status);
    const url=URL.createObjectURL(await res.blob());
    const ri=document.getElementById('resultImg');
    ri.src=url;ri.classList.add('show');
    const dl=document.getElementById('dlBtn');dl.href=url;dl.classList.add('show');
    st.className='status ok';st.textContent='✓ Done';
  }catch(err){
    st.className='status err';st.textContent='✗ '+err.message;
  }finally{
    document.getElementById('renderBtn').disabled=false;
  }
});
</script>
</body>
</html>
